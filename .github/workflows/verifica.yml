name: Verifica

on:
  push:
  pull_request:

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test delle regole e del backend demo
        run: npm test
      - name: Compilazione
        run: npm run build
      - name: Test end-to-end nel browser
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          node tests/e2e/demo.e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-demo
          path: |
            dist/index.html
            test-results/
